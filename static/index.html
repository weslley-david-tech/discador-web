<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discador PT-BR</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#1f2937}
header{padding:22px;background:#16213e;color:white;text-align:center}
main{max-width:950px;margin:24px auto;padding:0 16px}.card{background:white;padding:22px;border-radius:14px;margin-bottom:18px;box-shadow:0 2px 10px #0001}
button{padding:12px 18px;border:0;border-radius:8px;cursor:pointer;margin:4px;background:#16213e;color:white;font-size:14px}
button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:15px;background:#f4f6f8;border-radius:10px;text-align:center}.big{font-size:26px}
#message{padding:14px;background:#fff8dc;border-radius:10px;min-height:55px}
progress{width:100%;height:24px}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><h1>📞 Discador PT-BR</h1><div>Campanhas com Excel</div></header>
<main>
<div class="card"><h2>1. Carregar planilha</h2>
<p>Coluna A: telefone | Coluna B: mensagem</p>
<input type="file" id="file" accept=".xlsx,.xls"><button onclick="upload()">Carregar</button>
<p id="uploadInfo"></p></div>
<div class="card" id="dashboard" style="display:none">
<h2>2. Campanha</h2><div class="grid">
<div class="stat">Total<div class="big" id="total">0</div></div>
<div class="stat">Processados<div class="big" id="processed">0</div></div>
<div class="stat">Atendeu<div class="big" id="answered">0</div></div>
<div class="stat">Falhas<div class="big" id="failed">0</div></div></div>
<br><progress id="progress" value="0" max="1"></progress>
<p id="state">Status: aguardando</p>
<button onclick="action('start')">▶ Iniciar</button><button onclick="action('pause')">⏸ Pausar</button><button onclick="action('stop')">⏹ Parar</button>
<a id="export" href="#"><button>📥 Exportar resultado</button></a>
</div>
<div class="card" id="currentCard" style="display:none"><h2>Contato atual</h2>
<p id="currentPhone">Aguardando</p><div id="message">Aguardando mensagem</div><br>
<button onclick="result('ATENDEU')">Atendeu</button><button onclick="result('NAO_ATENDEU')">Não atendeu</button><button onclick="result('FALHOU')">Falhou</button>
</div></main>
<script>
let id=null;
async function upload(){let f=document.getElementById('file').files[0];if(!f)return alert('Selecione a planilha');
let fd=new FormData();fd.append('file',f);let r=await fetch('/api/upload',{method:'POST',body:fd});let d=await r.json();
if(!r.ok)return alert(d.detail);id=d.id;document.getElementById('uploadInfo').textContent=`${d.validos} válidos | ${d.invalidos} inválidos`;
document.getElementById('dashboard').style.display='block';document.getElementById('currentCard').style.display='block';
document.getElementById('export').href='/api/campaign/'+id+'/export';refresh();}
async function action(a){if(!id)return;await fetch(`/api/campaign/${id}/${a}`,{method:'POST'});refresh();}
async function result(x){if(!id)return;await fetch(`/api/campaign/${id}/result/${x}`,{method:'POST'});refresh();}
async function refresh(){if(!id)return;let d=await (await fetch('/api/campaign/'+id)).json(),c=d.counts||{};
total.textContent=d.total;processed.textContent=d.processed;answered.textContent=c.ATENDEU||0;failed.textContent=c.FALHOU||0;
progress.max=d.total||1;progress.value=d.processed;state.textContent='Status: '+d.state;
if(d.current){currentPhone.textContent='📞 '+d.current.telefone;message.textContent=d.current.mensagem}else{currentPhone.textContent='Campanha finalizada';message.textContent='Não há mais contatos';}}
setInterval(refresh,3000);
</script></body></html>
